server:
  port: 8081
spring:
  application:
    name: SERVICE-ACCOUNT
  config:
    import: "optional:configserver:http://localhost:8888"
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  config: classpath:logback-spring.xml